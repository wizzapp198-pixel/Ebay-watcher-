name: iOS-App bauen

# Achtung: macOS-Minuten zählen in privaten Repos 10-fach. Läuft daher nur bei Änderungen an ios/.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: Bauen (unsigniert)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Watcher.xcodeproj -scheme Watcher -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: .*Watcher/|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/Watcher.app

      - name: IPA packen
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Watcher.app Payload/
          zip -qry Watcher.ipa Payload
          ls -lh Watcher.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Watcher-ipa
          path: ios/Watcher.ipa

      - name: Als Release „ios-latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/Watcher.ipa --target "$GITHUB_SHA" \
            --title "Watcher iOS-App (neuester Build)" \
            --notes "Unsignierte IPA zum Sideloaden (AltStore, SideStore, Sideloadly …). Build: $GITHUB_SHA"
