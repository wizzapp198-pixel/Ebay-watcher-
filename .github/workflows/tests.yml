name: Tests

on:
  push:
    paths: ["watcher/**", "tests/**", "scripts/**", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Quellen-Diagnose (Kleinanzeigen von GitHub erreichbar?)
        continue-on-error: true
        run: |
          python -m watcher --probe
          sleep 5
          PROBE_QUERY="rx 9070 xt" PROBE_MAX=800 python -m watcher --probe
