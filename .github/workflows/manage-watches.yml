name: Suchaufträge verwalten

on:
  issues:
    types: [opened, edited]

concurrency:
  group: manage-watches
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    # Nur der Repo-Besitzer darf Suchaufträge ändern
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[Suchauftrag]') || startsWith(github.event.issue.title, '[Löschen]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -q pyyaml

      - name: Formular auswerten
        id: apply
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python scripts/manage_watches.py > result.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat result.md

      - name: Änderung committen
        if: steps.apply.outputs.rc == '0'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watches.yaml WATCHES.md watches.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Suchaufträge aktualisiert (Issue #$ISSUE_NUMBER)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Erstlauf starten (merkt vorhandene Angebote, kein Push)
        if: steps.apply.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref "${{ github.ref_name }}" || true

      - name: Antworten und schließen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -s result.md ] || echo "❌ Fehler bei der Verarbeitung, siehe Actions-Log." > result.md
          gh issue comment "$ISSUE_NUMBER" --body-file result.md
          gh issue close "$ISSUE_NUMBER"
