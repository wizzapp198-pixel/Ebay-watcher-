name: Watcher

on:
  schedule:
    # Privates Repo: alle 30 Min. (Gratis-Kontingent 2000 Min./Monat).
    # Hinweis: GitHub startet Cron-Jobs oft einige Minuten verspätet.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Test-Push senden"
        type: boolean
        default: false
      probe:
        description: "Nur Diagnose (Quellen testen, nichts pushen)"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write   # nur für den Daten-Branch "watcher-data" (gefundene Angebote für die Apps)
  models: read      # kostenlose KI-Prüfung über GitHub Models

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Zustand laden (gesehene Angebote)
        uses: actions/cache/restore@v4
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: seen-db-

      - name: Watcher ausführen
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DISABLED_SOURCES: ${{ vars.DISABLED_SOURCES }}
          TEST_PUSH: ${{ inputs.test_push }}
          PROBE: ${{ inputs.probe }}
          FOUND_OUT: new_found.json
        run: |
          ARGS="--once --schedule-interval 1800"
          if [ "$TEST_PUSH" = "true" ]; then ARGS="$ARGS --test-push"; fi
          if [ "$PROBE" = "true" ]; then ARGS="$ARGS --probe"; fi
          python -m watcher $ARGS

      - name: Funde für die Apps veröffentlichen (Branch watcher-data)
        if: always()
        run: |
          [ -s new_found.json ] || { echo "keine neuen Funde"; exit 0; }
          git config --global user.name "watcher-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin watcher-data; then
            git worktree add -q data FETCH_HEAD
          else
            git worktree add -q --orphan -b watcher-data data
          fi
          python -m watcher.found new_found.json data/found.json
          cd data
          git add found.json
          git commit -qm "Neue Funde" || exit 0
          for i in 1 2 3; do
            git push -q origin HEAD:refs/heads/watcher-data && break
            sleep 3; git pull -q --rebase origin watcher-data || true   # App hat inzwischen decisions.json geändert
          done

      - name: Zustand speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
